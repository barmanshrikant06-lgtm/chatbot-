
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.chat-container {
    width: 100%;
    max-width: 800px;
    height: 95vh;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 5px 30px #0002;
}

.header {
    background: #111827;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    font-size: 22px;
}

.header button {
    background: #ef4444;
    border: none;
    color: white;
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.chat-box {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
    background: #f8fafc;
}

.message {
    max-width: 80%;
    padding: 14px 17px;
    margin-bottom: 18px;
    border-radius: 15px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.bot {
    background: white;
    color: #1e293b;
    border: 1px solid #e2e8f0;
    border-bottom-left-radius: 3px;
}

.user {
    background: #2563eb;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 3px;
}

.input-area {
    padding: 18px;
    display: flex;
    gap: 12px;
    border-top: 1px solid #ddd;
}

.input-area input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 1px solid #cbd5e1;
    border-radius: 30px;
    outline: none;
    font-size: 15px;
}

.input-area input:focus {
    border-color: #2563eb;
}

.input-area button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 0 25px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

.input-area button:hover {
    background: #1d4ed8;
}

.typing {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 15px;
}

@media(max-width:600px) {
    .chat-container {
        height: 100vh;
        border-radius: 0;
    }

    .chat-box {
        padding: 15px;
    }

    .message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>🤖 AI Chatbot</h2>
        <button onclick="clearChat()">Clear Chat</button>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            👋 Hello! Welcome to My AI Chatbot.

            I am your virtual assistant.

            Ask me anything!
        </div>

    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
            autocomplete="off"
            onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button onclick="sendMessage()">➤</button>
    </div>

</div>

<script>

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");

// Add message
function addMessage(message, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = message;

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;
}

// Bot response
function getBotResponse(message) {

    let text = message.toLowerCase();

    if(text.includes("hello") || text.includes("hi")) {
        return "Hello! 😊 How can I help you today?";
    }

    if(text.includes("your name")) {
        return "I am your AI Chatbot Assistant 🤖";
    }

    if(text.includes("how are you")) {
        return "I am doing great! Thanks for asking. 😊";
    }

    if(text.includes("time")) {
        return "Your current time is " + new Date().toLocaleTimeString();
    }

    if(text.includes("date")) {
        return "Today's date is " + new Date().toLocaleDateString();
    }

    if(text.includes("javascript")) {
        return "JavaScript is a programming language used to make websites interactive.";
    }

    if(text.includes("html")) {
        return "HTML stands for HyperText Markup Language. It creates the structure of websites.";
    }

    if(text.includes("css")) {
        return "CSS is used to style websites with colors, layouts and animations.";
    }

    if(text.includes("thank")) {
        return "You're welcome! ❤️";
    }

    if(text.includes("bye")) {
        return "Goodbye! Have a wonderful day. 👋";
    }

    return "Interesting question! 😊 I am currently a basic demo chatbot. Connect an AI API to get intelligent answers to any question.";
}

// Send message
function sendMessage() {

    let message = userInput.value.trim();

    if(message === "") return;

    addMessage(message, "user");

    userInput.value = "";

    const typing = document.createElement("div");

    typing.className = "typing";

    typing.textContent = "🤖 AI is typing...";

    chatBox.appendChild(typing);

    chatBox.scrollTop = chatBox.scrollHeight;

    setTimeout(() => {

        typing.remove();

        const response = getBotResponse(message);

        addMessage(response, "bot");

    }, 800);
}

// Clear chat
function clearChat() {

    chatBox.innerHTML = "";

    addMessage("👋 Hello! Welcome back. Ask me anything!", "bot");

}

</script>

</body>
</html>
