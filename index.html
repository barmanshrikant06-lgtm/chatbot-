
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chatbot</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 850px;
    height: 95vh;
    background: white;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 30px #0002;
}

.header {
    background: #111827;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    font-size: 21px;
}

.header p {
    color: #86efac;
    font-size: 12px;
    margin-top: 5px;
}

.header button {
    background: #ef4444;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    background: #f8fafc;
}

.message {
    max-width: 85%;
    padding: 14px 17px;
    margin-bottom: 18px;
    border-radius: 15px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.bot {
    background: white;
    border: 1px solid #e2e8f0;
    color: #1e293b;
}

.user {
    background: #2563eb;
    color: white;
    margin-left: auto;
}

.typing {
    color: #64748b;
    padding: 10px;
    font-size: 13px;
}

.input-area {
    display: flex;
    padding: 18px;
    gap: 10px;
    border-top: 1px solid #eee;
}

.input-area input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 30px;
    outline: none;
    font-size: 15px;
}

.input-area button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 0 25px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 18px;
}

.input-area button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.footer {
    text-align: center;
    padding: 8px;
    font-size: 11px;
    color: #94a3b8;
}

@media(max-width:600px) {
    .app {
        height: 100vh;
        border-radius: 0;
    }

    .chat-box {
        padding: 15px;
    }

    .message {
        max-width: 92%;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div>
            <h2>🤖 Groq AI Chatbot</h2>
            <p>● Online | Powered by Groq AI</p>
        </div>

        <button onclick="clearChat()">Clear Chat</button>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            👋 Hello! Welcome to Groq AI Chatbot.

            I am your intelligent AI assistant.

            Ask me anything! 😊
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Message Groq AI..."
            autocomplete="off"
        >

        <button id="sendBtn" onclick="sendMessage()">➤</button>

    </div>

    <div class="footer">
        Powered by Groq API © 2026
    </div>

</div>

<script>

// ADD YOUR GROQ API KEY HERE
const API_KEY = "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";

// Groq model
const MODEL = "llama-3.3-70b-versatile";

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

let messages = [];

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;

    return div;
}

async function sendMessage() {

    const question = input.value.trim();

    if (!question || sendBtn.disabled) return;

    if (API_KEY === "YOUR_GROQ_API_KEY") {
        alert("Please add your Groq API key in the JavaScript code.");
        return;
    }

    addMessage(question, "user");

    input.value = "";

    messages.push({
        role: "user",
        content: question
    });

    sendBtn.disabled = true;

    const typing = addMessage(
        "🤖 AI is thinking...",
        "typing"
    );

    try {

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + API_KEY
                },

                body: JSON.stringify({

                    model: MODEL,

                    messages: [
                        {
                            role: "system",
                            content: "You are a helpful, intelligent and friendly AI assistant. Answer questions clearly."
                        },
                        ...messages
                    ],

                    temperature: 0.7,
                    max_completion_tokens: 1024

                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "Groq API request failed"
            );
        }

        const answer =
            data.choices?.[0]?.message?.content;

        if (!answer) {
            throw new Error("Empty response from AI");
        }

        typing.remove();

        messages.push({
            role: "assistant",
            content: answer
        });

        addMessage(answer, "bot");

    } catch (error) {

        typing.textContent = "❌ Error: " + error.message;

        messages.pop();

    } finally {

        sendBtn.disabled = false;
        input.focus();

    }
}

function clearChat() {

    messages = [];

    chatBox.innerHTML = "";

    addMessage(
        "👋 Hello! Welcome back. Ask me anything!",
        "bot"
    );

}

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
